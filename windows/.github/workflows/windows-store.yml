name: Build Sangam for Windows

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Set these three in: GitHub repo > Settings > Secrets and variables > Actions > Variables
      # (values come from Partner Center > your app > Product management > Product identity)
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build SangamSetup.exe (for friends / GitHub release)
        run: npm run dist:setup
      - name: Build Store package (.appx) for Partner Center
        if: ${{ env.STORE_IDENTITY_NAME != '' }}
        run: npm run dist:store
      - uses: actions/upload-artifact@v4
        with:
          name: sangam-windows
          path: |
            dist/*.exe
            dist/*.appx
          retention-days: 30
      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe dist/*.appx --title "Sangam for Windows ${{ github.ref_name }}" --notes "Windows build" --draft
