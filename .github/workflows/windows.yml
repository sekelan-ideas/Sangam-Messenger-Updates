name: Build Sangam for Windows

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - name: Run crypto self-test
        run: node tests/selftest.js
      - name: Build SangamSetup.exe
        run: npm run dist:setup
      - name: Build Store package (.appx) for Partner Center
        if: ${{ env.STORE_IDENTITY_NAME != '' }}
        run: npm run dist:store
      - uses: actions/upload-artifact@v4
        with:
          name: sangam-windows
          path: |
            windows/dist/*.exe
            windows/dist/*.appx
          retention-days: 30
