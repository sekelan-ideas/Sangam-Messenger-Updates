name: PublishTempLink
on:
  workflow_dispatch:
jobs:
  pub:
    runs-on: ubuntu-latest
    steps:
      - name: Zip the APK and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.14.1 -R "${{ github.repository }}" -p "Sangam-v2.14.1.apk" -D out --clobber
          cd out
          rm -f pack.zip
          date +%s%N > nonce.txt
          zip -q pack.zip Sangam-v2.14.1.apk nonce.txt
          sha256sum Sangam-v2.14.1.apk
          U=$(curl -s --retry 3 --retry-all-errors --max-time 200 -F "reqtype=fileupload" -F "fileToUpload=@pack.zip" https://catbox.moe/user/api.php | tr -d '\r\n' | head -1)
          echo "catbox -> $U"
          if ! echo "$U" | grep -q "^https"; then
            U=$(curl -s --retry 3 --retry-all-errors --max-time 200 -F "file=@pack.zip" https://litterbox.catbox.moe/resources/internals/api.php -F "time=72h" | tr -d '\r\n' | head -1)
            echo "litterbox -> $U"
          fi
          if ! echo "$U" | grep -q "^https"; then
            U=$(curl -s --retry 3 --retry-all-errors --max-time 200 -F "file=@pack.zip" https://0x0.st | tr -d '\r\n' | head -1)
            echo "0x0 -> $U"
          fi
          echo "TEMP_APK_URL=$U"
