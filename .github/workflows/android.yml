name: Build Sangam APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Materialize app icons from verified chunks
        run: |
          set -e
          FG=app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.webp
          LOGO=app/src/main/res/drawable/sangam_logo.webp
          if [ -f "$FG" ] && [ -f "$LOGO" ]; then
            echo "Icons already materialized."
            exit 0
          fi
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable
          cat iconsrc/fg/chunk.* | tr -d '\n' | base64 -d > "$FG"
          echo "e75c4cd062f6e0068503892907f2b31368f3ce4f742188a2d962b2747baf8aa3  $FG" | sha256sum -c -
          cat iconsrc/logo/chunk.* | tr -d '\n' | base64 -d > "$LOGO"
          echo "3462c69a1419286d4da41b9fc7d539009d56ec6ea61c8069125d2111702bb31e  $LOGO" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FG" "$LOGO"
          git rm -r -q iconsrc || true
          git commit -m "Materialize app icon + logo from verified chunks" || echo "nothing to commit"
          git push || echo "icon commit push failed (build continues)"

      - name: Verify Supabase backend is reachable and initialized
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi
          echo "Key length: ${#SUPABASE_ANON_KEY} characters (prefix $(echo "$SUPABASE_ANON_KEY" | cut -c1-15)...)."
          S1=$(curl -s -o /tmp/settings.json -w "%{http_code}" --connect-timeout 20 \
            "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Auth settings status: $S1"
          if [ "$S1" != "200" ]; then
            echo "Response body: $(head -c 300 /tmp/settings.json)"
            echo "::error::The publishable key was rejected (HTTP $S1 on /auth/v1/settings). Re-copy the full key from Settings > API using the copy icon."
            exit 1
          fi
          echo "Publishable key is valid."
          STATUS=$(curl -s -o /tmp/rest.json -w "%{http_code}" --connect-timeout 20 \
            "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_ANON_KEY")
          echo "REST spec status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            for T in profiles prekey_bundles messages; do
              if ! grep -q "\"$T\"" /tmp/rest.json; then
                echo "::error::Table '$T' not found in the backend. Run supabase/migrations/0001_init.sql in the Supabase SQL editor, then rebuild."
                exit 1
              fi
            done
            echo "All tables verified."
          else
            echo "REST spec not readable with key alone (expected on some projects); tables were created via the SQL editor."
          fi
          echo "Backend OK."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          fi

      - name: Build signed release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/release/app-release.apk Sangam-v${VERSION}.apk
          cp app/build/outputs/apk/release/app-release.apk Sangam.apk
          echo "APK=Sangam-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sangam-apk
          path: ${{ env.APK }}
          retention-days: 1

      - name: Create release with APK in main repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ env.VERSION }}" "${{ env.APK }}" Sangam.apk \
            --title "Sangam v${{ env.VERSION }}" \
            --notes "Installable, signed APK for Sangam v${{ env.VERSION }}." \
            || gh release upload "v${{ env.VERSION }}" "${{ env.APK }}" Sangam.apk --clobber

      - name: Publish directly to public Sangam-Messenger-Updates mirror (if RELEASE_TOKEN is configured)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_TOKEN secret not set; skipping mirror upload."
            exit 0
          fi
          for REPO in sekelan-ideas/Sangam-Messenger-Updates sekelan-ideas/Sangam-releases; do
            gh release create "v${{ env.VERSION }}" "${{ env.APK }}" Sangam.apk \
              --repo "$REPO" \
              --title "Sangam v${{ env.VERSION }}" \
              --notes "Installable, signed APK for Sangam v${{ env.VERSION }}." \
              || gh release upload "v${{ env.VERSION }}" "${{ env.APK }}" Sangam.apk \
                 --repo "$REPO" --clobber || true
          done
